name: Archive browser QA

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [codex/restore-local-previews]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:ui -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: archive-qa-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
